name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        id: about-cache
        with:
          path: ~/.cargo/bin/cargo-about
          key: cargo-about-0.9.2-ubuntu-24.04
      - if: steps.about-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-about --version 0.9.2 --features cli --locked
      - name: Collect dependency license text and MPL source
        run: |
          mkdir licenses
          cargo about generate --locked scripts/dependency-licenses.hbs > licenses/DEPENDENCY_LICENSES.txt
          python3 scripts/package-dependency-sources.py licenses
          git diff --exit-code Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: licenses
          path: licenses/
          if-no-files-found: error

  build:
    needs: licenses
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary: fwm
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: fwm
          - os: macos-15
            target: aarch64-apple-darwin
            binary: fwm
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: fwm
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: fwm.exe
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/download-artifact@v4
        with:
          name: licenses
          path: licenses
      - name: Verify tag, build, and test on the target platform
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python3 -c 'import os,tomllib; v=tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"]; assert os.environ["RELEASE_TAG"] == "v"+v'
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked --target '${{ matrix.target }}' -- -D warnings
          cargo test --workspace --locked --target '${{ matrix.target }}'
          cargo build --release --locked --target '${{ matrix.target }}'
      - name: Test release installer fixtures
        if: runner.os != 'Windows'
        run: python3 tests/install_release.py -v
      - name: Package binary and notices
        shell: bash
        run: python3 scripts/package-release.py --target '${{ matrix.target }}' --binary 'target/${{ matrix.target }}/release/${{ matrix.binary }}' --licenses licenses
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          commit=$(git rev-parse HEAD)
          run=$(gh run list --workflow ci.yml --commit "$commit" --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$run" && test "$run" != null
          gh run watch "$run" --exit-status --interval 20
      - name: Create checksum manifest
        run: |
          cp install.sh dist/install.sh
          cd dist
          sha256sum fwm-*.tar.gz fwm-*.zip install.sh > SHA256SUMS
      - name: Upload the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state 2>/dev/null; then
            test "$(cat release-state)" = true || { echo "Refusing to replace an already published release" >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "fwm $RELEASE_TAG" --notes-file docs/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
