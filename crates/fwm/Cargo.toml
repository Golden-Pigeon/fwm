[package]
name = "fwm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "fwm"
path = "src/main.rs"

[dependencies]
fwm-core = { path = "../fwm-core" }
fwm-api = { path = "../fwm-api" }
anyhow.workspace = true
clap.workspace = true
directories.workspace = true
fs2.workspace = true
rand.workspace = true
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
unicode-width = "0.2.2"
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"] }
shlex = "2.0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_Memory"] }

[dev-dependencies]
tempfile.workspace = true
